play:
  name: "txt2stream"
  description: "Reads a text file using the failover-capable Streaming TTS Proxy."
  fields:
    config_entry:
      name: "TTS Instance"
      description: "Select the Streaming TTS Proxy integration instance to use."
      required: true
      selector:
        config_entry:
          integration: streaming_tts_proxy
    entity_id:
      name: "Media Player"
      description: "Target player(s)."
      required: true
      selector:
        entity:
          domain: media_player
    file_path:
      name: "File Path"
      description: "Full path to book.txt (e.g. /media/book.txt)."
      required: true
      selector:
        text: {}
    voice:
      name: "Voice"
      description: "Override default voice (optional)."
      required: false
      selector:
        text: {}
    block_index:
      name: "Start Block Index"
      description: "Optional: Start from a specific block number (0 for beginning)."
      required: false
      selector:
        number:
          min: 0
          max: 99999
          mode: box
    timer:
      name: "Sleep Timer"
      description: "Time in minutes to play before stopping automatically."
      required: false
      selector:
        number:
          min: 1
          max: 480
          unit_of_measurement: "min"
          mode: box